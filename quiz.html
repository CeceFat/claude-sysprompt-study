<h1>自我檢測</h1>
<p class="lede">
15 題。答錯不要緊，每題解析都附出處連結——重點是把「印象」換成「查得到」。
選完會立刻顯示對錯與解析，最後給你一份針對錯題的複習清單。
</p>

<div class="toolbar">

</div>

<script src="assets/app.js"></script>
<script>
var QS = [
 { q: "這批公開的 system prompt，適用範圍是什麼？",
   o: ["claude.ai 網頁與 iOS／Android app",
       "所有使用 Claude 模型的產品，包含 API",
       "只有 Claude Code 與 Cowork 等 agent 產品",
       "Anthropic 內部測試環境"],
   a: 0,
   e: "官方 overview 明文：<span class='en'>These system prompt updates do not apply to the Claude API</span>。把它當成模型的通用規則是最常見的誤讀——它約束的是產品預設行為。",
   ref: ["method.html", "方法與證據"] },

 { q: "字數走勢中，唯一一次「主動大幅砍回」發生在哪一版？",
   o: ["Opus 4.1（2025-08-05，2,880 字）",
       "Sonnet 4.5（2025-09-29，1,973 字）",
       "Opus 4.8（2026-05-28，3,350 字）",
       "Claude 4（2025-05-22，1,706 字）"],
   a: 1,
   e: "從 2,880 砍到 1,973，一次刪掉 AI 本性、反諂媚、紅旗等 12 段。Opus 4.8 的 3,350 是壓縮改寫（字數降但功能更多），Claude 4 則是清掉 2024 年的弱點補丁，兩者性質不同。",
   ref: ["versions.html", "版本總表"] },

 { q: "2025-11-19 的公開區塊移除了三個沿用已久的固定句。以下哪一句<b>不在</b>移除之列？",
   o: ["The assistant is Claude, created by Anthropic.",
       "The current date is {{currentDateTime}}.",
       "Claude is now being connected with a person.",
       "Claude uses markdown for code."],
   a: 3,
   e: "前三句在 2025-11-19 一次消失，代表公開頁從「完整 prompt」變成「組裝式 prompt 的一個行為組件」。markdown for code 是格式規則，一直都在。",
   ref: ["shifts.html#d", "躍遷 D"] },

 { q: "<code class='xml'>&lt;anthropic_reminders&gt;</code> 這一段最重要的意義是什麼？",
   o: ["列出 Claude 可以主動呼叫的工具",
       "把「靜態骨架＋執行期動態提醒」的兩層投遞架構寫成明文，並附注入防禦條款",
       "說明使用者可以在設定中關閉哪些功能",
       "提醒 Claude 對話長度上限"],
   a: 1,
   e: "它列出五到六種由分類器觸發、附在 user turn 末尾的提醒，同時寫明 <span class='en'>Anthropic will never send reminders or warnings that reduce Claude's restrictions</span>——把「降低限制的訊息一律不可信」變成規則。",
   ref: ["themes.html#t10", "主題 4.10"] },

 { q: "<code class='xml'>&lt;election_info&gt;</code> 的完整生命週期是？",
   o: ["2025-05 加入後一直保留至今",
       "只在 Claude 4 世代出現過一次",
       "2025-05 加入 → Opus 4.5 刪 → Opus 4.6 重現 → Sonnet 4.6 起永久刪",
       "2026-02 才首次加入，用於美國期中選舉"],
   a: 2,
   e: "「刪掉又回來」正是分支維護的直接證據：Opus 系與 Sonnet 系不是同一份文件在前進。而且 Opus 4.6 重現時整段擠成一行（<a href='method.html#q5'>Q5</a>），像是手動貼回。",
   ref: ["branches.html", "分支與兄弟版"] },

 { q: "「不問許可就使用 web search」這條規則的命運是？",
   o: ["Sonnet 4.5（2025-09-29）唯一一版有，兩個月後回退",
       "從 2025-09 起所有版本都保留",
       "Opus 系有、Sonnet 系沒有",
       "只有 Fable 系有"],
   a: 0,
   e: "2025-11-19 改回「告知使用者可以開啟搜尋」。這說明 search 是使用者可關閉的功能，prompt 不能預設工具一定存在——這是理解所有 agentic 條文的前提。",
   ref: ["themes.html#t2", "主題 4.2"] },

 { q: "Haiku 3.5 的 text+images 變體標在 2024-10-22 之下。為什麼這個日期不可信？",
   o: ["因為它的字數比同期版本多",
       "因為它是 text+images 變體，本來就不標日期",
       "因為內容提到 Sonnet 3.7、使用 2025-02 的 model string、cutoff 寫 start of December 2024",
       "因為 Haiku 3.5 在 2024-10 尚未發布"],
   a: 2,
   e: "它其實是 3.7 世代模板套用到 Haiku 名下。這是全份文件影響最大的一項品質瑕疵，所以本站把它排在第 12 位並全站加註。",
   ref: ["method.html#q1", "品質警語 Q1"] },

 { q: "Sonnet 4 與 Opus 4 的 2025-08-05 條目，與 2025-07-31 條目的關係是？",
   o: ["新增了 evenhandedness 六段",
       "逐字相同，只是 Opus 4.1 發布日的同步收錄",
       "刪除了人格前言",
       "改寫了 knowledge cutoff 段"],
   a: 1,
   e: "diff 為空（本站已重跑確認）。把它當成一次改版會高估改版頻率——真正在 08-05 有變動的是 Opus 4.1 那一頁。",
   ref: ["method.html#q2", "品質警語 Q2"] },

 { q: "Opus 5（2026-07-24）的骨架承自哪一版？",
   o: ["同期的 Fable 5（2026-06-09）",
       "Opus 4.8（2026-05-28）",
       "Sonnet 4.6（2026-02-17）",
       "全新改寫，不承自任何版本"],
   a: 1,
   e: "Opus 5 保留 4.8 的 default_stance、tone_preference、CBRN＋常規武器全段，而 Fable 5 把這些都刪了。時間上更近的版本不代表血緣更近——這是三分支結構最好的例子。",
   ref: ["branches.html", "分支與兄弟版"] },

 { q: "依 Fable 5 的條文，Claude Fable 5 與 Claude Mythos 5 的關係是？",
   o: ["兩個不同規模的模型，Mythos 較大",
       "同一個底層模型；Fable 多了 dual-use 能力的安全措施，Mythos 不含這些措施且僅供核可組織使用",
       "Mythos 是 Fable 的前一代",
       "Mythos 是 Fable 的內部代號，沒有實際產品差異"],
   a: 1,
   e: "原文：<span class='en'>share the same underlying model ... Claude Mythos 5 is available without those measures to only approved organizations</span>。同一組權重、兩種安全包裝、兩個產品，prompt 文字也隨之分支。",
   ref: ["shifts.html#e", "躍遷 E"] },

 { q: "Opus 5 的 <code class='xml'>&lt;fable_safeguards_routing&gt;</code> 說明了什麼？",
   o: ["Fable 5 會在負載過高時降級到 Opus 5",
       "使用者選了 Fable 5，某些查詢會被安全路由改由 Opus 5 回答，平均觸發率不到 5% 的 session",
       "Opus 5 可以主動把對話轉給 Fable 5",
       "路由由使用者在設定中自行開關"],
   a: 1,
   e: "所以當回覆自稱的模型或 knowledge cutoff 與你選的不一致時，那是預期行為而非故障。prompt 必須讓被路由到的模型能解釋自己的處境。",
   ref: ["branches.html", "實務含意 5"] },

 { q: "Fable 5.1（4,267 字）成為歷史最長，主要因為新增了什麼？",
   o: ["更長的心理健康協定",
       "完整的工具使用手冊",
       "著作權區塊，並首次在 prompt 內放入 few-shot 範例",
       "所有既有模型的 model string 清單"],
   a: 2,
   e: "著作權段涵蓋歌詞／詩／書摘、1929 年前的公共領域例外、以程式碼繪製的視覺作品（SVG／CSS／ASCII）、角色本身受保護，並配兩則 <code class='xml'>&lt;example&gt;</code> 示範怎麼拒絕。",
   ref: ["themes.html#t5", "主題 4.5"] },

 { q: "語言跟隨規則（「使用者用哪種語言就用哪種回答」）在 2025-05-22 起被刪除。最合理的推論是？",
   o: ["Claude 從此不再自動跟隨語言",
       "該行為已由訓練承擔，不需要 prompt 維持",
       "改由使用者偏好設定控制",
       "被合併進 evenhandedness 區塊"],
   a: 1,
   e: "這是全份文件裡最乾淨的例子：規則明確、行為可觀察、刪除後行為未變。用它建立一個核心判準——<b>prompt 裡沒有，不等於模型不會</b>。",
   ref: ["themes.html#t13", "主題 4.13"] },

 { q: "<code class='xml'>&lt;evenhandedness&gt;</code> 首見於哪一版？它對使用者的直接影響是什麼？",
   o: ["Sonnet 3.7（2025-02-24）；Claude 會拒絕討論政治",
       "Opus 4.1（2025-08-05）；要求單方論證時，Claude 傾向在結尾補上反方觀點",
       "Sonnet 4.5（2025-09-29）；Claude 會主動搜尋事實查核",
       "Opus 4.8（2026-05-28）；Claude 會拒絕給出個人意見"],
   a: 1,
   e: "原文要求 <span class='en'>ends its response ... by presenting opposing perspectives or empirical disputes ... even for positions it agrees with</span>。如果你要的是純粹一方立場，必須明示「不附反方」。",
   ref: ["themes.html#t9", "主題 4.9"] },

 { q: "Opus 4.8 的 <code class='xml'>&lt;respond_without_citing_system_prompt&gt;</code> 帶來什麼實務後果？",
   o: ["Claude 不會再拒絕任何請求",
       "追問「你為什麼這樣做」時，Claude 不會把行為歸因於 system prompt，所以問不出規則出處",
       "Claude 會在每次回覆結尾附上規則編號",
       "使用者可以要求 Claude 完整背出 system prompt"],
   a: 1,
   e: "原文批評 <span class='en'>Statements like \"my system prompt requires me to...\"</span> 會以「訴諸隱藏規則」取代真實理由。要查規則，只能靠本站這類外部整理對照。",
   ref: ["branches.html", "實務含意 6"] }
];

var wrap = document.getElementById('qs');
var answered = {}, correct = 0;

function render() {
  answered = {}; correct = 0;
  document.getElementById('score').style.display = 'none';
  wrap.innerHTML = QS.map(function (item, i) {
    var opts = item.o.map(function (o, k) {
      return '<label class="opt" data-q="' + i + '" data-k="' + k + '">' +
             '<input type="radio" name="q' + i + '"> ' + o + '</label>';
    }).join('');
    return '<div class="quiz-q" id="qq' + i + '">' +
      '<p class="stem">' + (i + 1) + '. ' + item.q + '</p>' + opts +
      '<div class="expl" id="ex' + i + '"></div></div>';
  }).join('');
  bump();
}

function bump() {
  var n = Object.keys(answered).length;
  document.getElementById('progress').textContent = n + ' / ' + QS.length + ' 作答';
  if (n === QS.length) finish();
}

function finish() {
  var wrong = QS.map(function (item, i) { return answered[i] === item.a ? null : i; }).filter(function (x) { return x !== null; });
  var pct = Math.round(correct / QS.length * 100);
  var verdict = pct >= 87 ? '這份材料你已經能拿來用了。' :
                pct >= 67 ? '主軸掌握了，錯的多半在分支與品質警語。' :
                pct >= 40 ? '結構有了，細節需要再走一次主題軌跡。' :
                            '建議從總覽的學習路徑第 1、2 步重來。';
  var list = wrong.length
    ? '<p style="margin:10px 0 4px"><b>複習清單</b></p><ul style="margin:0">' + wrong.map(function (i) {
        return '<li>第 ' + (i + 1) + ' 題 — <a href="' + QS[i].ref[0] + '">' + QS[i].ref[1] + '</a></li>';
      }).join('') + '</ul>'
    : '<p style="margin:10px 0 0">全對。可以去<a href="matrix.html">特徵矩陣</a>挑一個片語自己驗一次，那才是真的會了。</p>';
  var el = document.getElementById('score');
  el.innerHTML = '<p class="kicker">結果</p><p style="font-size:20px;margin:0 0 6px"><b>' + correct + ' / ' + QS.length + '</b>（' + pct + '%）　' + verdict + '</p>' + list;
  el.style.display = '';
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

wrap.addEventListener('click', function (e) {
  var lab = e.target.closest('.opt');
  if (!lab) return;
  var i = +lab.dataset.q, k = +lab.dataset.k;
  if (i in answered) return;
  answered[i] = k;
  var item = QS[i];
  if (k === item.a) correct++;
  document.querySelectorAll('.opt[data-q="' + i + '"]').forEach(function (o) {
    var ok = +o.dataset.k === item.a;
    if (ok) o.classList.add('correct');
    if (+o.dataset.k === k && !ok) o.classList.add('wrong');
    o.querySelector('input').checked = (+o.dataset.k === k);
  });
  var ex = document.getElementById('ex' + i);
  ex.innerHTML = (k === item.a ? '<b style="color:var(--ok)">答對　</b>' : '<b style="color:var(--warn)">再看一次　</b>') +
                 item.e + ' <a href="' + item.ref[0] + '">→ ' + item.ref[1] + '</a>';
  ex.classList.add('show');
  bump();
});

document.getElementById('reset').onclick = render;
render();
</script>
