var wrap = document.getElementById('qs');
var answered = {}, correct = 0;

function render() {
  answered = {}; correct = 0;
  document.getElementById('score').style.display = 'none';
  wrap.innerHTML = QS.map(function (item, i) {
    var opts = item.o.map(function (o, k) {
      return '<label class="opt" data-q="' + i + '" data-k="' + k + '">' +
             '<input type="radio" name="q' + i + '"> ' + o + '</label>';
    }).join('');
    return '<div class="quiz-q" id="qq' + i + '">' +
      '<p class="stem">' + (i + 1) + '. ' + item.q + '</p>' + opts +
      '<div class="expl" id="ex' + i + '"></div></div>';
  }).join('');
  bump();
}

function bump() {
  var n = Object.keys(answered).length;
  document.getElementById('progress').textContent = n + ' / ' + QS.length + ' 作答';
  if (n === QS.length) finish();
}

function finish() {
  var wrong = QS.map(function (item, i) { return answered[i] === item.a ? null : i; }).filter(function (x) { return x !== null; });
  var pct = Math.round(correct / QS.length * 100);
  var verdict = pct >= 87 ? '這份材料你已經能拿來用了。' :
                pct >= 67 ? '主軸掌握了，錯的多半在分支與品質警語。' :
                pct >= 40 ? '結構有了，細節需要再走一次主題軌跡。' :
                            '建議從總覽的學習路徑第 1、2 步重來。';
  var list = wrong.length
    ? '<p style="margin:10px 0 4px"><b>複習清單</b></p><ul style="margin:0">' + wrong.map(function (i) {
        return '<li>第 ' + (i + 1) + ' 題 — <a href="' + QS[i].ref[0] + '">' + QS[i].ref[1] + '</a></li>';
      }).join('') + '</ul>'
    : '<p style="margin:10px 0 0">全對。可以去<a href="matrix.html">特徵矩陣</a>挑一個片語自己驗一次，那才是真的會了。</p>';
  var el = document.getElementById('score');
  el.innerHTML = '<p class="kicker">結果</p><p style="font-size:20px;margin:0 0 6px"><b>' + correct + ' / ' + QS.length + '</b>（' + pct + '%）　' + verdict + '</p>' + list;
  el.style.display = '';
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

wrap.addEventListener('click', function (e) {
  var lab = e.target.closest('.opt');
  if (!lab) return;
  var i = +lab.dataset.q, k = +lab.dataset.k;
  if (i in answered) return;
  answered[i] = k;
  var item = QS[i];
  if (k === item.a) correct++;
  document.querySelectorAll('.opt[data-q="' + i + '"]').forEach(function (o) {
    var ok = +o.dataset.k === item.a;
    if (ok) o.classList.add('correct');
    if (+o.dataset.k === k && !ok) o.classList.add('wrong');
    o.querySelector('input').checked = (+o.dataset.k === k);
  });
  var ex = document.getElementById('ex' + i);
  ex.innerHTML = (k === item.a ? '<b style="color:var(--ok)">答對　</b>' : '<b style="color:var(--warn)">再看一次　</b>') +
                 item.e + ' <a href="' + item.ref[0] + '">→ ' + item.ref[1] + '</a>';
  ex.classList.add('show');
  bump();
});

document.getElementById('reset').onclick = render;
render();
</script>
</body>
</html>
